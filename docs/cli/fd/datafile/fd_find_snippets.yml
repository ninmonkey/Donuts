update: 2026-08-13
title: fd find command
about: the cli command `fd` find is a cross platform better find command. It's to the find command that `ripgrep` is to `grep` `
---
# regionBegin: important links
links:
  - name: 'source'
    url: https://github.com/sharkdp/fd

# regionBegin: inline examples
snippets:
  - name: 'install: fd'
    desc: |
        windows and linux install instructions
    code: |
        # windows
        winget install --id sharkdp.fd --exact

        # linux
        apt install fd-find

  - name: 'fast find git repos (using fd-find)'
    desc: |
        Quickly find all git repositories under a specific directory.
        Pipe to Get-Item if it's powershell
    code: |
        fd '^\.git$' --base-directory 'C:\GitRepos' -HI --absolute-path | Split-Path | Get-Item
        