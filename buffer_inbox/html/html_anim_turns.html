<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>anim test</title>
</head>
<!-- <script type="text/javascript"> -->
    <script type="module">
    const container = document.querySelector( ".container" );
    for ( let i = 0; i <= 100; i++ ) {
        container.appendChild( document.createElement( "div" ) )
    }
</script>
<style type="text/css">
    :root {
        background-color: rgb(183, 184, 245);
    }

    /* 1. Register a custom property so the browser can animate it as a number */
    @property --spin {
        syntax: "<number>";
        inherits: true;
        initial-value: 0;
    }

    .container {
        --num-cols: 5;
        display: grid;
        grid-template-columns: repeat(
            var(--num-cols),
            1fr
        );
        padding: 30px;

        &>div {
            --base-color: rgb(211, 71, 71);
            background-color: var(--bg);
            transform: rotate(calc(0.15turn * sibling-index() * var(--spin)));

            animation: rotateItems 4s ease-in-out infinite alternate;

            width: 25vh;
            height: 5vh;
            outline: 2px solid brown;

            --bg: oklch(from var(--base-color) .5 .5 calc(sibling-index() * .25turn));
        }
    }

    @keyframes rotateItems {
        from {
            --spin: 0;
        }

        to {
            --spin: 1;
        }
    }
</style>

<body>
    <article>
        <div class="container"></div>
    </article>
</body>

</html>
